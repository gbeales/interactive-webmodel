<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Flexible 3D Sheet</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f1117;
        color: #eef3ff;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 100vh;
      }

      .panel {
        padding: 16px;
        border-right: 1px solid #2d3242;
        background: #171b27;
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }

      .panel p {
        margin: 0 0 12px;
        line-height: 1.4;
        color: #bfc8e0;
      }

      .panel label {
        display: block;
        margin: 12px 0 6px;
        font-size: 0.9rem;
      }

      .panel input[type='file'] {
        width: 100%;
        font-size: 0.82rem;
      }

      #viewport {
        width: 100%;
        height: 100vh;
      }

      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .panel {
          border-right: 0;
          border-bottom: 1px solid #2d3242;
        }

        #viewport {
          height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside class="panel">
        <h1>Flexible 3D Sheet Demo</h1>
        <p>
          Upload front/back textures and use the floating controls in the top-right to move the
          direct light and tune ambient illumination.
        </p>
        <label for="frontImage">Front face image</label>
        <input id="frontImage" type="file" accept="image/*" />

        <label for="backImage">Back face image</label>
        <input id="backImage" type="file" accept="image/*" />
      </aside>
      <main id="viewport"></main>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm';

      const viewport = document.getElementById('viewport');
      const frontInput = document.getElementById('frontImage');
      const backInput = document.getElementById('backImage');

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      viewport.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f1117);

      const camera = new THREE.PerspectiveCamera(52, viewport.clientWidth / viewport.clientHeight, 0.1, 100);
      camera.position.set(0, 0.4, 2.4);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.25);
      directionalLight.position.set(1.2, 1.4, 1.8);
      scene.add(directionalLight);

      const fillLight = new THREE.DirectionalLight(0x8aa9ff, 0.35);
      fillLight.position.set(-1.7, -0.8, -1.2);
      scene.add(fillLight);

      const textureLoader = new THREE.TextureLoader();
      const defaultFrontTexture = textureLoader.load('https://picsum.photos/seed/frontface/1024/1024');
      const defaultBackTexture = textureLoader.load('https://picsum.photos/seed/backface/1024/1024');
      defaultFrontTexture.colorSpace = THREE.SRGBColorSpace;
      defaultBackTexture.colorSpace = THREE.SRGBColorSpace;

      const planeGeometry = new THREE.PlaneGeometry(1.8, 1.2, 80, 60);
      const basePositions = planeGeometry.attributes.position.array.slice();

      const frontMaterial = new THREE.MeshStandardMaterial({
        map: defaultFrontTexture,
        side: THREE.FrontSide,
        roughness: 0.7,
        metalness: 0.05,
      });

      const backMaterial = new THREE.MeshStandardMaterial({
        map: defaultBackTexture,
        side: THREE.BackSide,
        roughness: 0.7,
        metalness: 0.05,
      });

      const frontMesh = new THREE.Mesh(planeGeometry, frontMaterial);
      const backMesh = new THREE.Mesh(planeGeometry, backMaterial);
      const sheetGroup = new THREE.Group();
      sheetGroup.add(frontMesh);
      sheetGroup.add(backMesh);
      scene.add(sheetGroup);

      const options = {
        ambientIntensity: ambientLight.intensity,
        lightX: directionalLight.position.x,
        lightY: directionalLight.position.y,
        lightZ: directionalLight.position.z,
        preset: 'Soft Paper',
        maxBend: 0.12,
        springStiffness: 12,
        springDamping: 5.5,
        returnStiffness: 6,
        edgeDriveGain: 0.11,
        edgeExponent: 1.25,
        dragRotateGain: 0.008,
        inputVelocityDamping: 5.5,
      };

      const presets = {
        'Soft Paper': {
          maxBend: 0.12,
          springStiffness: 12,
          springDamping: 5.5,
          returnStiffness: 6,
          edgeDriveGain: 0.11,
          edgeExponent: 1.25,
          dragRotateGain: 0.008,
          inputVelocityDamping: 5.5,
        },
        'Soft Fabric': {
          maxBend: 0.18,
          springStiffness: 8,
          springDamping: 7.5,
          returnStiffness: 4,
          edgeDriveGain: 0.14,
          edgeExponent: 1.08,
          dragRotateGain: 0.01,
          inputVelocityDamping: 6.5,
        },
        'Stiff Card': {
          maxBend: 0.05,
          springStiffness: 26,
          springDamping: 6.5,
          returnStiffness: 14,
          edgeDriveGain: 0.06,
          edgeExponent: 1.45,
          dragRotateGain: 0.006,
          inputVelocityDamping: 7,
        },
      };

      const applyPreset = (name) => {
        const preset = presets[name];
        if (!preset) {
          return;
        }

        Object.assign(options, preset);
        updateEdgeWeights();
        gui.controllersRecursive().forEach((controller) => controller.updateDisplay());
      };

      const gui = new GUI({ title: 'Lighting + Flex Controls' });
      gui.add(options, 'preset', Object.keys(presets)).onChange((value) => {
        applyPreset(value);
      });
      gui.add(options, 'ambientIntensity', 0, 2, 0.01).onChange((value) => {
        ambientLight.intensity = value;
      });
      gui.add(options, 'lightX', -5, 5, 0.01).onChange((value) => {
        directionalLight.position.x = value;
      });
      gui.add(options, 'lightY', -5, 5, 0.01).onChange((value) => {
        directionalLight.position.y = value;
      });
      gui.add(options, 'lightZ', -5, 5, 0.01).onChange((value) => {
        directionalLight.position.z = value;
      });
      gui.add(options, 'maxBend', 0.01, 0.2, 0.001);
      gui.add(options, 'springStiffness', 5, 120, 1);
      gui.add(options, 'springDamping', 1, 24, 0.1);
      gui.add(options, 'returnStiffness', 1, 50, 0.5);
      gui.add(options, 'edgeDriveGain', 0.005, 0.2, 0.001);
      gui.add(options, 'edgeExponent', 1, 3, 0.05).onChange(() => {
        updateEdgeWeights();
      });
      gui.add(options, 'dragRotateGain', 0.001, 0.02, 0.0005);

      const uploadTexture = (file, onReady) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const image = new Image();
          image.onload = () => {
            const texture = new THREE.Texture(image);
            texture.needsUpdate = true;
            texture.colorSpace = THREE.SRGBColorSpace;
            onReady(texture);
          };
          image.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      frontInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) {
          return;
        }
        uploadTexture(file, (texture) => {
          frontMaterial.map = texture;
          frontMaterial.needsUpdate = true;
        });
      });

      backInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) {
          return;
        }
        uploadTexture(file, (texture) => {
          backMaterial.map = texture;
          backMaterial.needsUpdate = true;
        });
      });

      const widthSegments = planeGeometry.parameters.widthSegments;
      const heightSegments = planeGeometry.parameters.heightSegments;
      const nodeCountX = widthSegments + 1;
      const nodeCountY = heightSegments + 1;

      const positions = planeGeometry.attributes.position;
      const nodeCount = positions.count;
      const clock = new THREE.Clock();
      const springPos = new Float32Array(nodeCount);
      const springVel = new Float32Array(nodeCount);
      const xDir = new Float32Array(nodeCount);
      const yDir = new Float32Array(nodeCount);
      const edgeWeight = new Float32Array(nodeCount);

      for (let ix = 0; ix < nodeCountX; ix += 1) {
        const t = nodeCountX > 1 ? ix / (nodeCountX - 1) : 0.5;
        const centered = t * 2 - 1;
        for (let iy = 0; iy < nodeCountY; iy += 1) {
          const index = iy * nodeCountX + ix;
          xDir[index] = Math.sign(centered);
        }
      }

      for (let iy = 0; iy < nodeCountY; iy += 1) {
        const t = nodeCountY > 1 ? iy / (nodeCountY - 1) : 0.5;
        const centered = t * 2 - 1;
        for (let ix = 0; ix < nodeCountX; ix += 1) {
          const index = iy * nodeCountX + ix;
          yDir[index] = Math.sign(centered);
        }
      }

      const computeEdgeWeight = (index) => {
        const ix = index % nodeCountX;
        const iy = Math.floor(index / nodeCountX);
        const xT = nodeCountX > 1 ? ix / (nodeCountX - 1) : 0.5;
        const yT = nodeCountY > 1 ? iy / (nodeCountY - 1) : 0.5;
        const xDistance = Math.abs(xT * 2 - 1);
        const yDistance = Math.abs(yT * 2 - 1);
        return Math.pow(Math.max(xDistance, yDistance), options.edgeExponent);
      };

      const computeCenterAnchorWeight = (index) => 1 - computeEdgeWeight(index);

      const centerAnchorWeight = new Float32Array(nodeCount);

      function updateEdgeWeights() {
        for (let index = 0; index < nodeCount; index += 1) {
          edgeWeight[index] = computeEdgeWeight(index);
          centerAnchorWeight[index] = computeCenterAnchorWeight(index);
        }
      }
      updateEdgeWeights();

      applyPreset(options.preset);

      let isDraggingSheet = false;
      let lastPointerX = 0;
      let lastPointerY = 0;
      let lastPointerTime = 0;
      let inputAngularVelocityX = 0;
      let inputAngularVelocityY = 0;

      renderer.domElement.addEventListener('pointerdown', (event) => {
        isDraggingSheet = true;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        lastPointerTime = performance.now();
        renderer.domElement.setPointerCapture(event.pointerId);
      });

      renderer.domElement.addEventListener('pointermove', (event) => {
        if (!isDraggingSheet) {
          return;
        }

        const now = performance.now();
        const dt = Math.max((now - lastPointerTime) / 1000, 1 / 240);
        const dx = event.clientX - lastPointerX;
        const dy = event.clientY - lastPointerY;

        const deltaRotY = dx * options.dragRotateGain;
        const deltaRotX = dy * options.dragRotateGain;

        sheetGroup.rotation.y += deltaRotY;
        sheetGroup.rotation.x = THREE.MathUtils.clamp(sheetGroup.rotation.x + deltaRotX, -1.25, 1.25);

        inputAngularVelocityY = THREE.MathUtils.lerp(inputAngularVelocityY, deltaRotY / dt, 0.45);
        inputAngularVelocityX = THREE.MathUtils.lerp(inputAngularVelocityX, deltaRotX / dt, 0.45);

        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        lastPointerTime = now;
      });

      const endPointerInteraction = (event) => {
        if (!isDraggingSheet) {
          return;
        }
        isDraggingSheet = false;
        if (renderer.domElement.hasPointerCapture(event.pointerId)) {
          renderer.domElement.releasePointerCapture(event.pointerId);
        }
      };

      renderer.domElement.addEventListener('pointerup', endPointerInteraction);
      renderer.domElement.addEventListener('pointercancel', endPointerInteraction);

      const animate = () => {
        const delta = Math.min(clock.getDelta(), 1 / 20);

        if (!isDraggingSheet) {
          const velocityDecay = Math.exp(-options.inputVelocityDamping * delta);
          inputAngularVelocityX *= velocityDecay;
          inputAngularVelocityY *= velocityDecay;
        }

        for (let iy = 0; iy < nodeCountY; iy += 1) {
          for (let ix = 0; ix < nodeCountX; ix += 1) {
            const index = iy * nodeCountX + ix;
            const center = springPos[index];
            const left = ix > 0 ? springPos[index - 1] - center : 0;
            const right = ix < nodeCountX - 1 ? springPos[index + 1] - center : 0;
            const down = iy > 0 ? springPos[index - nodeCountX] - center : 0;
            const up = iy < nodeCountY - 1 ? springPos[index + nodeCountX] - center : 0;
            const edgeDrive = edgeWeight[index] **  1.4;
            const centerAnchor = centerAnchorWeight[index] ** 1.3;

            const driveX = -inputAngularVelocityY * xDir[index];
            const driveY = inputAngularVelocityX * yDir[index];

            const drive = (driveX + driveY) * edgeDrive * options.edgeDriveGain;
            const neighborCoupling = options.springStiffness * (0.35 + 0.65 * edgeDrive);
            const anchorCoupling = options.returnStiffness * (0.15 + 0.85 * centerAnchor);
            const acceleration =
              neighborCoupling * (left + right + down + up) -
              options.springDamping * springVel[index] -
              // anchorCoupling * center +
              drive;

            springVel[index] += acceleration * delta;
            springPos[index] = THREE.MathUtils.clamp(
              center + springVel[index] * delta,
              -options.maxBend,
              options.maxBend
            );
          }
        }

        for (let i = 0; i < positions.count; i += 1) {
          const idx = i * 3;
          positions.array[idx + 2] = basePositions[idx + 2] + springPos[i];
        }

        positions.needsUpdate = true;
        planeGeometry.computeVertexNormals();

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };

      animate();

      const onResize = () => {
        const { clientWidth, clientHeight } = viewport;
        camera.aspect = clientWidth / clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(clientWidth, clientHeight);
      };

      window.addEventListener('resize', onResize);
    </script>
  </body>
</html>
